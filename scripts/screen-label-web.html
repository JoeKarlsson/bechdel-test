<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page vs screen labels</title>
<style>
	:root { --ink: #1b1b1f; --muted: #6b6b75; --line: #e3e1dc; --paper: #fbfaf7; --mark: #fff1a8; --accent: #c2185b; }
	* { box-sizing: border-box; }
	[hidden] { display: none !important; }
	body { margin: 0; font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--paper); }
	main { max-width: 1100px; margin: 0 auto; padding: 20px 24px 60px; }
	header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
	header .count { font-weight: 600; }
	header .film { color: var(--muted); }
	.bar { flex: 1 1 200px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
	.bar span { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s ease-out; }
	h1 { font-size: 1.15rem; font-weight: 600; margin: 28px 0 8px; }
	.target { font-size: 1.45rem; line-height: 1.35; background: #fff; border: 2px solid var(--ink); border-radius: 10px; padding: 16px 20px; }
	.answers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 18px 0 6px; }
	@media (max-width: 760px) { .answers { grid-template-columns: repeat(2, 1fr); } }
	.answers button { font: inherit; font-weight: 600; padding: 12px 18px; border-radius: 10px; border: 2px solid var(--ink); background: #fff; cursor: pointer; text-align: left; }
	.answers button:hover { background: #f1efe9; }
	.answers button:active { transform: scale(.97); }
	.answers button[aria-pressed="true"] { background: var(--ink); color: #fff; }
	.answers kbd { font: 600 .8rem system-ui, sans-serif; border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; margin-right: 8px; }
	.answers small { display: block; font-weight: 400; font-size: .8rem; color: var(--muted); }
	.answers button[aria-pressed="true"] small { color: #d8d8de; }
	.answers button.empty { visibility: hidden; }
	.nav { display: flex; gap: 10px; margin: 10px 0 0; color: var(--muted); font-size: .9rem; align-items: center; flex-wrap: wrap; }
	.nav button { font: inherit; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
	.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 24px; }
	@media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
	section h2 { font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
	ol.lines { list-style: none; margin: 0; padding: 10px 12px; background: #fff; border: 1px solid var(--line); border-radius: 10px; font-size: .95rem; }
	ol.lines li { padding: 3px 6px; border-radius: 4px; }
	ol.lines li.here { background: var(--mark); font-weight: 600; }
	ol.lines li.match { background: #dcecff; box-shadow: inset 3px 0 0 #1f5fbf; }
	.hint { font-size: .85rem; color: var(--muted); margin: 6px 0 0; }
	.time { font-size: .8rem; font-variant-numeric: tabular-nums; color: var(--muted); margin-right: 8px; }
	.search { margin-top: 24px; }
	.search input { font: inherit; width: 100%; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
	mark { background: var(--mark); }
	.saved { color: var(--accent); font-weight: 600; font-size: 1rem; }
	:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
	.target.fresh { animation: fresh .5s ease-out; }
	@keyframes fresh { from { background: var(--mark); } to { background: #fff; } }
	@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<main>
	<header>
		<span class="count" id="count"></span>
		<span class="bar" aria-hidden="true"><span id="bar"></span></span>
		<span class="film" id="film"></span>
	</header>
	<h1 id="question"></h1>
	<div class="target" id="target"></div>
	<div class="answers" id="answers"></div>
	<div class="nav">
		<button id="prev">Previous</button>
		<button id="next">Next</button>
		<button id="skip">Next unanswered</button>
		<span id="status" role="status"></span>
	</div>
	<div id="groups" hidden>
		<p id="summary"></p>
		<div class="cols" id="groupList"></div>
	</div>
	<div class="cols" id="cols">
		<section><h2 id="leftTitle"></h2><ol class="lines" id="left"></ol></section>
		<section><h2 id="rightTitle"></h2><ol class="lines" id="right"></ol><p class="hint" id="hint"></p></section>
	</div>
	<div class="search">
		<input id="q" type="search" placeholder="Search this film's whole script and subtitles  ( / )" aria-label="Search this film's script and subtitles">
		<div class="cols" id="results" hidden>
			<section><h2>Script</h2><ol class="lines" id="inScript"></ol></section>
			<section><h2>Subtitles</h2><ol class="lines" id="inSubs"></ol></section>
		</div>
	</div>
</main>
<script>
// Every kind of item uses the same four keys with the same meaning, so the answers never move:
// 1 there as written, 2 there but changed, 3 not there, 4 can't tell. [label, name, hint]; null leaves the slot empty.
const OPTIONS = {
	'script line': [
		['kept', 'There, as written', 'small differences are fine'],
		['changed', 'There, but changed', 'reworded or only part of it'],
		['cut', 'Not there', 'not in the subtitles (search to be sure)'],
		['unsure', 'Can’t tell', 'the subtitles don’t settle it'],
	],
	'subtitle line': [
		['scripted', 'There, as written', 'small differences are fine'],
		['scripted', 'There, but changed', 'reworded or only part of it'],
		['not in script', 'Not there', 'new or improvised (search to be sure)'],
		['unsure', 'Can’t tell', 'e.g. a one-word line'],
	],
	audio: [
		['subtitles trimmed', 'Said as written', 'the subtitles just shortened it'],
		['really changed', 'Said, but changed', 'reworded or only part of it'],
		['really cut', 'Not said', 'nowhere near this point'],
		['unsure', 'Can’t tell', 'can’t make it out'],
	],
	verdict: [
		['passes on screen', 'Passes', 'two named women talk, not about a man'],
		null,
		['fails on screen', 'Fails', 'no such conversation in the film'],
		['unsure', 'Can’t tell', 'the scenes don’t settle it'],
	],
};
const QUESTIONS = {
	'script line': () => 'Does this script line show up in the subtitles on the right?',
	'subtitle line': () => 'Does this subtitle line show up in the script on the right, even reworded?',
	audio: item => `Play the film at about ${item.at}. Is this script line said?`,
	verdict: item => `${item.change === 'page-pass-screen-fail' ? 'The script passes; the subtitles don’t.' : 'The script fails; the subtitles pass.'} In the film, do two named women talk to each other about something other than a man?`,
};
const $ = id => document.getElementById(id);
let data;
let at = 0;

// words of a line without its timestamp or speaker name, for spotting the closest line
const words = text => new Set(text.replace(/^\d+:\d\d:\d\d\s+/, '').replace(/^[A-Z][A-Z .'-]*:\s*/, '')
	.toLowerCase().match(/[a-z0-9']+/g) ?? []);
// the line sharing the most words with the target (Dice overlap), or -1 if none shares at least a third
const closest = (target, lines) => {
	const want = words(target);
	let best = -1;
	let bestScore = 0.34;
	lines.forEach((line, i) => {
		const have = words(line);
		const shared = [...want].filter(w => have.has(w)).length;
		const score = (2 * shared) / (want.size + have.size || 1);
		if (score >= bestScore) { best = i; bestScore = score; }
	});
	return best;
};

const fill = (list, lines, here = -1, matches = []) => {
	list.replaceChildren(...lines.map((text, i) => {
		const li = document.createElement('li');
		const time = text.match(/^(\d+:\d\d:\d\d)\s+(.*)$/);
		if (time) {
			const span = document.createElement('span');
			span.className = 'time';
			span.textContent = time[1];
			li.append(span, time[2]);
		} else li.textContent = text;
		if (i === here) li.className = 'here';
		if (matches.includes(i)) li.className = 'match';
		return li;
	}));
};

const show = () => {
	const item = data.items[at];
	const done = Object.keys(data.labels).length;
	$('count').textContent = `Item ${at + 1} of ${data.items.length} · ${done} answered`;
	$('bar').style.width = `${(100 * done) / data.items.length}%`;
	$('film').textContent = item.film;
	// the subtitles are the record of what's said (CODEBOOK.md): nobody needs to know the film
	$('question').textContent = QUESTIONS[item.kind](item);
	$('target').hidden = item.kind === 'verdict';
	$('target').textContent = item.kind === 'verdict' ? '' : item.line;
	$('cols').hidden = item.kind === 'verdict';
	$('groups').hidden = item.kind !== 'verdict';
	const chosen = data.labels[item.key];
	const options = OPTIONS[item.kind];
	const firstChosen = options.findIndex(o => o?.[0] === chosen);
	$('answers').replaceChildren(...options.map((option, i) => {
		const b = document.createElement('button');
		if (!option) { b.className = 'empty'; b.disabled = true; b.setAttribute('aria-hidden', 'true'); return b; }
		const [label, name, hint] = option;
		b.setAttribute('aria-pressed', String(i === firstChosen));
		b.innerHTML = `<kbd></kbd><span></span><small></small>`;
		b.querySelector('kbd').textContent = String(i + 1);
		b.querySelector('span').textContent = name;
		b.querySelector('small').textContent = hint;
		b.onclick = () => answer(i);
		return b;
	}));
	if (item.kind === 'verdict') {
		$('summary').textContent = item.summary;
		$('groupList').replaceChildren(...item.groups.map((group, g) => {
			const section = document.createElement('section');
			const h2 = document.createElement('h2');
			h2.textContent = group.title;
			const ol = document.createElement('ol');
			ol.className = 'lines';
			// subtitles beside a script conversation: blue marks the closest subtitle to each script line
			const script = g % 2 === 1 && item.change === 'page-pass-screen-fail' ? item.groups[g - 1].lines : [];
			fill(ol, group.lines, -1, script.map(line => closest(line, group.lines)));
			section.append(h2, ol);
			return section;
		}));
	} else if (item.kind === 'script line' || item.kind === 'audio') {
		$('leftTitle').textContent = 'Script around it';
		fill($('left'), item.scriptAround, item.scriptAround.indexOf(item.line));
		$('rightTitle').textContent = 'Subtitles near where it would be';
		showClosest($('right'), item.subtitlesNearWhereItWouldBe, 'subtitle', item.line);
	} else {
		$('leftTitle').textContent = 'Subtitles around it';
		fill($('left'), item.subtitlesAround, item.subtitlesAround.findIndex(l => l.endsWith(item.line)));
		$('rightTitle').textContent = 'Script near where it would be';
		showClosest($('right'), item.scriptNearWhereItWouldBe, 'script line', item.line);
	}
	$('q').value = '';
	$('results').hidden = true;
	$('status').textContent = '';
};

const showClosest = (list, lines, what, target) => {
	const match = closest(target, lines);
	fill(list, lines, -1, [match]);
	$('hint').textContent = match === -1
		? `No ${what} nearby shares many words with it. Search to be sure.`
		: `Blue: the ${what} sharing the most words with it. Only a word match, so check it.`;
};

const nextUnanswered = () => {
	for (let k = 1; k <= data.items.length; k++) {
		const i = (at + k) % data.items.length;
		if (!data.labels[data.items[i].key]) return i;
	}
	return -1;
};

const answer = async slot => {
	const item = data.items[at];
	const option = OPTIONS[item.kind][slot];
	if (!option) return;
	const [label, name] = option;
	const res = await fetch('/label', { method: 'POST', body: JSON.stringify({ key: item.key, label }) });
	if (!res.ok) { $('status').textContent = `Not saved: ${(await res.json()).error}`; return; }
	data.labels[item.key] = label;
	const next = nextUnanswered();
	if (next === -1) { show(); $('status').innerHTML = '<span class="saved">All done. Tell Claude.</span>'; return; }
	at = next;
	show();
	// restart the flash so every save shows, even two in a row
	$('target').classList.remove('fresh');
	void $('target').offsetWidth;
	$('target').classList.add('fresh');
	$('status').innerHTML = '<span class="saved"></span>';
	$('status').firstChild.textContent = `Saved item ${data.items.indexOf(item) + 1}: ${name}`;
};

const search = () => {
	const q = $('q').value.trim().toLowerCase();
	if (q.length < 2) { $('results').hidden = true; return; }
	const film = data.films[data.items[at].filmIndex];
	const hits = lines => lines.filter(l => l.toLowerCase().includes(q)).slice(0, 40);
	const mark = list => [...list.children].forEach(li => {
		const node = [...li.childNodes].find(n => n.nodeType === 3 && n.textContent.toLowerCase().includes(q));
		if (!node) return;
		const i = node.textContent.toLowerCase().indexOf(q);
		const m = document.createElement('mark');
		m.textContent = node.textContent.slice(i, i + q.length);
		node.replaceWith(node.textContent.slice(0, i), m, node.textContent.slice(i + q.length));
	});
	fill($('inScript'), hits(film.script)); mark($('inScript'));
	fill($('inSubs'), hits(film.subtitles)); mark($('inSubs'));
	$('results').hidden = false;
};

document.addEventListener('keydown', e => {
	if (e.target === $('q')) { if (e.key === 'Escape') $('q').blur(); return; }
	if (e.metaKey || e.ctrlKey || e.altKey) return;
	if (e.key === '/') { e.preventDefault(); $('q').focus(); return; }
	if (e.key === 'ArrowRight') { at = Math.min(data.items.length - 1, at + 1); show(); return; }
	if (e.key === 'ArrowLeft') { at = Math.max(0, at - 1); show(); return; }
	if (['1', '2', '3', '4'].includes(e.key)) answer(Number(e.key) - 1);
});
$('prev').onclick = () => { at = Math.max(0, at - 1); show(); };
$('next').onclick = () => { at = Math.min(data.items.length - 1, at + 1); show(); };
$('skip').onclick = () => { const n = nextUnanswered(); if (n >= 0) { at = n; show(); } };
$('q').addEventListener('input', search);

fetch('/data').then(r => r.json()).then(d => {
	data = d;
	const first = data.items.findIndex(i => !data.labels[i.key]);
	at = first === -1 ? 0 : first;
	show();
});
</script>
</body>
</html>
