name: Site

# Builds and tests the public site on every change to it, and deploys it to
# GitHub Pages from main when every check passes.
on:
  push:
    branches: [main]
    paths: ['site/**', 'data/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', 'data/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: site

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      # The lockfile is written by npm 12; Node 22's bundled npm 10 reads it differently
      - name: Use npm 12
        run: npm install -g npm@12.2.1

      - run: npm ci

      - name: Audit what ships
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Unit and build-output tests
        run: npm test

      # --with-deps pulls ~110 packages from Ubuntu's Azure mirror, which usually
      # takes 30-60s but sometimes crawls for 10+ minutes. Give each try 4
      # minutes; packages already downloaded stay in apt's cache for the next.
      - name: Install browsers
        run: |
          for attempt in 1 2 3; do
            timeout 4m npx playwright install --with-deps chromium webkit && exit 0
            echo "::warning::Browser install attempt $attempt failed or took over 4 minutes"
            # timeout can't stop the root apt-get Playwright started, and it holds the dpkg lock
            sudo pkill -x apt-get || true
            while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 2; done
            sudo dpkg --configure -a
          done
          exit 1

      - name: End-to-end, accessibility and layout tests (desktop, Pixel, iPhone)
        run: npm run e2e

      - name: Screenshot baselines (commit any new ones from this artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: site/e2e/__screenshots__
          if-no-files-found: ignore

      - name: Lighthouse (mobile, every category 90 or above)
        run: npm run lighthouse

      - name: Lighthouse reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: site/.lighthouseci
          if-no-files-found: ignore

      - name: Outside links
        run: npm run check-links

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
