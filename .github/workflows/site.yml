name: Site

# Builds and tests the public site on every change to it, and deploys it to
# GitHub Pages from main when every check passes.
on:
  push:
    branches: [main]
    paths: ['site/**', 'data/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', 'data/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: site

jobs:
  test:
    runs-on: ubuntu-latest
    # Playwright's image ships its browsers and their system libraries, so the
    # job never waits on Ubuntu's apt mirrors (which failed every run on
    # 2026-11-11). Keep the tag in step with @playwright/test in site/package.json.
    container: mcr.microsoft.com/playwright:v1.65.0-resolute
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      # The lockfile is written by npm 12; Node 22's bundled npm 10 reads it differently
      - name: Use npm 12
        run: npm install -g npm@12.2.1

      - run: npm ci

      - name: Audit what ships
        # GHSA-fc5q-39xc-vjpf: a picomatch ReDoS with no fixed version yet (2026-11-18).
        # picomatch only runs in the build, on this repo's own globs. Drop it once a fix ships.
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit.json" || true
          node -e '
            const ignored = new Set(["GHSA-fc5q-39xc-vjpf"]);
            const { vulnerabilities = {} } = require(process.argv[1]);
            const found = Object.values(vulnerabilities).flatMap((v) => v.via.filter((a) => typeof a === "object" && ["high", "critical"].includes(a.severity)));
            const left = found.filter((a) => !ignored.has(a.url.split("/").pop()));
            for (const a of left) console.log(a.severity, a.name, a.url);
            process.exit(left.length ? 1 : 0);
          ' "$RUNNER_TEMP/audit.json"

      - name: Build
        run: npm run build

      - name: Unit and build-output tests
        run: npm test

      - name: End-to-end, accessibility and layout tests (desktop, Pixel, iPhone)
        run: npm run e2e

      - name: Screenshot baselines (commit any new ones from this artifact)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: screenshots
          path: site/e2e/__screenshots__
          if-no-files-found: ignore

      # Lighthouse runs the image's Chromium; the container runs as root, where Chrome needs --no-sandbox
      - name: Lighthouse (mobile, every category 90 or above)
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npm run lighthouse -- --collect.settings.chromeFlags=--no-sandbox

      - name: Lighthouse reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lighthouse
          path: site/.lighthouseci
          if-no-files-found: ignore

      - name: Outside links
        run: npm run check-links

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/dist
          # Or /.well-known/security.txt is left out of the deploy
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      # Pages has dropped files from a deploy before (/.well-known/ until
      # include-hidden-files), so check the live site serves them
      - name: Live site serves security.txt
        # This job has no checkout, so the default site/ directory doesn't exist
        working-directory: .
        run: curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors -o /dev/null "${{ steps.deployment.outputs.page_url }}.well-known/security.txt"
